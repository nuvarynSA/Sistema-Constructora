<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra de color -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="400" font-weight="bold" text-anchor="middle" fill="url(#shadowGradient)" transform="translate(8, 8)">N</text>
  
  <!-- Letra N principal -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="400" font-weight="bold" text-anchor="middle" fill="url(#mainGradient)">N</text>
  
  <!-- Definiciones de gradientes -->
  <defs>
    <!-- Gradiente para la sombra -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Gradiente principal -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>

